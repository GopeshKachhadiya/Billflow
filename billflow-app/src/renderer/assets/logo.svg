<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded Box with Cream/Beige Background & Deep Ink Border -->
  <rect x="12" y="12" width="232" height="232" rx="44" fill="#faf6e6" stroke="#302b24" stroke-width="10"/>
  <!-- Gold Shimmer Diagonal Accent -->
  <path d="M12 60L196 244H244V196L60 12H12V60Z" fill="url(#gold-shimmer)" opacity="0.35"/>
  <!-- Sanskrit 'Sa' Monogram in Top-Left Corner -->
  <text x="40" y="140" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="125" fill="#302b24" text-anchor="start">स</text>
  <!-- Stamp Gold Accent Line at Bottom Right -->
  <rect x="135" y="175" width="70" height="8" rx="4" fill="#a88d2e" opacity="0.85"/>
  <defs>
    <linearGradient id="gold-shimmer" x1="12" y1="12" x2="244" y2="244" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a88d2e" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a88d2e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a88d2e" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
