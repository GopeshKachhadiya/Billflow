name: BillFlow CI/CD Build & Test Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install App Dependencies
        run: |
          cd billflow-app
          npm install

      - name: Run GST Engine Unit Tests
        run: |
          node billflow-app/src/gst/test-calculator.js

      - name: Build Desktop Application (Dry Run)
        run: |
          cd billflow-app
          npm run build:modern -- --executableArgs="--no-sandbox"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
