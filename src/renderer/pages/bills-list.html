<div class="bills-list-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
  <h1>Bills</h1>
  <div style="display: flex; gap: 12px;">
    <button id="btn-import-bills" class="btn">Import Bills</button>
    <button id="btn-new-bill" class="btn btn-primary">+ New Bill</button>
  </div>
</div>

<!-- Filters Panel -->
<div class="card" style="padding: 16px; margin-bottom: 20px;">
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; align-items: end;">
    <div class="form-group" style="margin-bottom: 0;">
      <label for="filter-search">Search Bill No / Customer</label>
      <input type="text" id="filter-search" placeholder="Search...">
    </div>
    <div class="form-group" style="margin-bottom: 0;">
      <label for="filter-status">Status</label>
      <select id="filter-status">
        <option value="all">All Statuses</option>
        <option value="draft">Draft</option>
        <option value="sent">Sent</option>
        <option value="paid">Paid</option>
        <option value="overdue">Overdue</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </div>
    <div class="form-group" style="margin-bottom: 0;">
      <label for="filter-date-from">Date From</label>
      <input type="date" id="filter-date-from">
    </div>
    <div class="form-group" style="margin-bottom: 0;">
      <label for="filter-date-to">Date To</label>
      <input type="date" id="filter-date-to">
    </div>
    <div style="text-align: right;">
      <button id="btn-export-csv" class="btn" style="width: 100%;">Export CSV</button>
    </div>
  </div>
</div>

<!-- Bills Table Card -->
<div class="card" style="padding: 0;">
  <div class="table-responsive" style="overflow-x: auto;">
    <table>
      <thead>
        <tr>
          <th>Bill Number</th>
          <th>Customer</th>
          <th>Bill Date</th>
          <th>Due Date</th>
          <th>Grand Total</th>
          <th>Status</th>
          <th style="text-align: right; padding-right: 24px;">Actions</th>
        </tr>
      </thead>
      <tbody id="bills-table-body">
        <!-- Rendered dynamically -->
      </tbody>
    </table>
  </div>
</div>
