<div class="login-container" style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
  <div class="card" style="width: 400px; max-width: 90%; text-align: left; padding: 32px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05); border-radius: 12px;">
    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
      <div class="logo-mark" style="width: 42px; height: 42px; border-radius: 8px; background-color: var(--color-surface-elevated); border: 1.5px solid var(--color-primary); display: flex; align-items: flex-start; justify-content: flex-start; padding: 3px 0 0 6px; position: relative; overflow: hidden; box-shadow: var(--shadow-paper-md); flex-shrink: 0;">
        <span style="font-family: var(--font-serif); font-weight: 900; font-size: 26px; color: var(--color-primary); user-select: none; line-height: 1;">B</span>
        <div style="position: absolute; inset: 0; background: linear-gradient(135deg, transparent, rgba(168, 141, 46, 0.25), transparent);"></div>
      </div>
      <div>
        <h2 style="font-size: 22px; font-weight: 700; color: var(--color-primary); margin-bottom: 2px; line-height: 1;">Unlock BillFlow</h2>
        <span style="font-family: var(--font-mono); font-size: 10px; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 1.5px;">The Digital Ledger</span>
      </div>
    </div>
    <p style="color: var(--color-text-muted); font-size: 13px; margin-bottom: 24px;">Enter your login credentials to decrypt your local data store.</p>
    
    <div id="login-error" class="badge badge-overdue" style="display: none; width: 100%; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; text-transform: none; text-align: left; font-size: 13px; font-weight: 500;"></div>

    <div class="form-group">
      <label for="login-email">Email Address</label>
      <input type="email" id="login-email" placeholder="owner@business.com">
    </div>

    <div class="form-group" style="margin-bottom: 24px;">
      <label for="login-password">Decryption Password</label>
      <input type="password" id="login-password" placeholder="••••••••">
    </div>

    <button id="login-btn" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 14px;">Unlock Database</button>
  </div>
</div>
