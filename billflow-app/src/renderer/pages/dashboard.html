<div class="dashboard-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
  <h1>Dashboard</h1>
  <div class="quick-actions" style="display: flex; gap: 12px;">
    <button id="btn-new-bill" class="btn btn-primary">+ New Bill</button>
    <button id="btn-new-customer" class="btn">+ New Customer</button>
  </div>
</div>

<!-- Summary Card Grid -->
<div class="card-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 24px;">
  <div class="card" style="margin-bottom: 0; padding: 20px;">
    <div style="font-size: 12px; font-weight: 600; color: var(--color-text-muted); text-transform: uppercase; margin-bottom: 8px;">Total Bills</div>
    <div id="card-total" style="font-size: 28px; font-weight: 700; color: var(--color-text);">0</div>
  </div>
  <div class="card" style="margin-bottom: 0; padding: 20px;">
    <div style="font-size: 12px; font-weight: 600; color: var(--color-text-muted); text-transform: uppercase; margin-bottom: 8px;">Paid (This Month)</div>
    <div id="card-paid" style="font-size: 28px; font-weight: 700; color: var(--color-success);">₹0.00</div>
  </div>
  <div class="card" style="margin-bottom: 0; padding: 20px;">
    <div style="font-size: 12px; font-weight: 600; color: var(--color-text-muted); text-transform: uppercase; margin-bottom: 8px;">Outstanding Unpaid</div>
    <div id="card-unpaid" style="font-size: 28px; font-weight: 700; color: var(--color-warning);">₹0.00</div>
  </div>
  <div class="card" style="margin-bottom: 0; padding: 20px;">
    <div style="font-size: 12px; font-weight: 600; color: var(--color-text-muted); text-transform: uppercase; margin-bottom: 8px;">Overdue Invoices</div>
    <div id="card-overdue" style="font-size: 28px; font-weight: 700; color: var(--color-danger);">0</div>
  </div>
</div>

<!-- Recent Invoices table card -->
<div class="card">
  <h2 style="font-size: 16px; font-weight: 700; margin-bottom: 16px;">Recent Bills</h2>
  <div class="table-responsive" style="overflow-x: auto;">
    <table>
      <thead>
        <tr>
          <th>Bill Number</th>
          <th>Customer Name</th>
          <th>Bill Date</th>
          <th>Grand Total</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="recent-bills-body">
        <!-- Rendered dynamically -->
      </tbody>
    </table>
  </div>
</div>
