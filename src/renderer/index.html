<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BillFlow</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*; img-src 'self' data:;">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@300;400;500&family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles-modern.css">
  <!-- Vendor libraries (exposed as globals in renderer context) -->
  <script src="js/vendor/gst-calculator.js"></script>
  <script src="js/vendor/amount-to-words.js"></script>
  <script src="js/vendor/date-utils.js"></script>
  <script src="js/vendor/format-currency.js"></script>
  <script src="js/vendor/state-codes.js"></script>
</head>
<body>
  <div id="app-container">
    <!-- Top logo bar and user status -->
    <div id="topbar">
      <div id="topbar-logo-wrapper" style="display: flex; align-items: center; gap: 10px; cursor: pointer;" onclick="loadPage('dashboard')">
        <div class="logo-mark" style="width: 34px; height: 34px; border-radius: 6px; background-color: var(--color-surface-elevated); border: 1.5px solid var(--color-primary); display: flex; align-items: flex-start; justify-content: flex-start; padding: 2px 0 0 5px; position: relative; overflow: hidden; box-shadow: var(--shadow-paper); flex-shrink: 0;">
          <span style="font-family: var(--font-serif); font-weight: 900; font-size: 22px; color: var(--color-primary); user-select: none; line-height: 1;">B</span>
          <div style="position: absolute; inset: 0; background: linear-gradient(135deg, transparent, rgba(168, 141, 46, 0.25), transparent);"></div>
        </div>
        <div style="display: flex; flex-direction: column; justify-content: center;">
          <span id="topbar-logo" style="font-family: var(--font-serif); font-size: 20px; font-weight: 700; color: var(--color-primary); line-height: 1.1; letter-spacing: -0.5px;">BillFlow</span>
          <span style="font-family: var(--font-mono); font-size: 9px; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 1.5px; margin-top: -2px;">The Digital Ledger</span>
        </div>
      </div>
      <div id="topbar-right">
        <span id="user-email"></span>
        <button id="logout-btn" class="btn" style="display: none;">Logout</button>
      </div>
    </div>
    <!-- Main layout panel -->
    <div id="main-layout">
      <!-- Navigation Sidebar -->
      <nav id="sidebar" style="display: none;">
        <ul>
          <li><a href="#" data-page="dashboard" class="active">Dashboard</a></li>
          <li><a href="#" data-page="bills-list">Bills</a></li>
          <li><a href="#" data-page="customers-list">Customers</a></li>
          <li><a href="#" data-page="catalog-list">Items</a></li>
          <li><a href="#" data-page="reports">Reports</a></li>
          <li><a href="#" data-page="settings">Settings</a></li>
        </ul>
      </nav>
      <!-- Page Content Viewer -->
      <main id="content">
        <div class="page-loading">Loading...</div>
      </main>
    </div>
    <!-- Status footer -->
    <div id="statusbar">
      <span id="sync-badge">● Synced</span>
      <span id="app-version">v1.0.0</span>
    </div>
  </div>
  <!-- Application components -->
  <script src="js/components/toast.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/sync-status.js"></script>
  <script src="app.js"></script>
</body>
</html>
