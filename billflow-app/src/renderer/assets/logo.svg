<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Box in Cream/Beige with Bold Dark Ink Border -->
  <rect x="10" y="10" width="100" height="100" rx="20" fill="#faf6e6" stroke="#302b24" stroke-width="4"/>
  <!-- Subtle Gold Shimmer Gradient Accent -->
  <path d="M10 30L90 110H110V90L30 10H10V30Z" fill="url(#gold-shimmer)" opacity="0.25"/>
  <!-- Bold Dark Monogram Serif 'B' Placed at Top-Left Corner with Increased Font Size (64px) -->
  <text x="28" y="70" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="64" fill="#302b24" text-anchor="start">B</text>
  <!-- Small Ink Pen Nib Watermark Icon at Bottom Right -->
  <path d="M82 65 L89 72 L79 82 L72 75 Z M70 77 L77 84 L65 96 L61 96 L61 92 Z" fill="#a88d2e" opacity="0.6"/>
  
  <defs>
    <linearGradient id="gold-shimmer" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a88d2e" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a88d2e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a88d2e" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
