<div class="catalog-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
  <h1>Items Catalog</h1>
  <button id="btn-add-item" class="btn btn-primary">+ Add Item</button>
</div>

<!-- Filter and Search -->
<div class="card" style="padding: 16px; margin-bottom: 20px;">
  <div style="display: flex; gap: 16px; align-items: center;">
    <div style="flex: 1;">
      <input type="text" id="catalog-search" placeholder="Search by name or HSN/SAC..." style="width: 100%;">
    </div>
    <div style="width: 150px;">
      <select id="catalog-filter-active">
        <option value="all">All Items</option>
        <option value="active" selected>Active Only</option>
        <option value="inactive">Inactive Only</option>
      </select>
    </div>
  </div>
</div>

<!-- Catalog Table -->
<div class="card" style="padding: 0; overflow: hidden;">
  <div class="table-responsive">
    <table style="margin-bottom: 0;">
      <thead>
        <tr>
          <th>Name</th>
          <th>Description</th>
          <th>HSN/SAC</th>
          <th>Unit</th>
          <th style="text-align: right;">Unit Price</th>
          <th style="text-align: right;">GST Rate</th>
          <th style="text-align: center;">Status</th>
          <th style="text-align: right; width: 120px;">Actions</th>
        </tr>
      </thead>
      <tbody id="catalog-tbody">
        <!-- Rendered dynamically -->
      </tbody>
    </table>
  </div>
</div>

<!-- Modal for Create/Edit Item -->
<div id="item-modal" class="modal-overlay" style="display: none;">
  <div class="modal-box" style="width: 480px; text-align: left;">
    <h2 id="modal-title" style="margin-bottom: 20px; font-size: 16px; font-weight: 700; border-bottom: 1px solid var(--color-border); padding-bottom: 10px;">Add New Item</h2>
    
    <input type="hidden" id="m-item-id">
    
    <div class="form-group">
      <label>Item Name *</label>
      <input type="text" id="m-item-name" placeholder="e.g. Wireless Mouse">
    </div>
    
    <div class="form-group">
      <label>Description</label>
      <textarea id="m-item-desc" rows="2" placeholder="e.g. USB Wireless Mouse 2.4Ghz"></textarea>
    </div>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
      <div class="form-group">
        <label>HSN/SAC</label>
        <input type="text" id="m-item-hsn" placeholder="e.g. 8471">
      </div>
      <div class="form-group">
        <label>Unit</label>
        <select id="m-item-unit">
          <option value="Nos" selected>Nos (Numbers)</option>
          <option value="Kg">Kg (Kilograms)</option>
          <option value="Ltr">Ltr (Litres)</option>
          <option value="Box">Box (Boxes)</option>
          <option value="Hrs">Hrs (Hours)</option>
          <option value="Pcs">Pcs (Pieces)</option>
        </select>
      </div>
    </div>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
      <div class="form-group">
        <label>Unit Price (₹) *</label>
        <input type="number" id="m-item-price" step="0.01" value="0.00">
      </div>
      <div class="form-group">
        <label>GST Rate (%) *</label>
        <select id="m-item-gst">
          <option value="0">0%</option>
          <option value="5">5%</option>
          <option value="12">12%</option>
          <option value="18" selected>18%</option>
          <option value="28">28%</option>
        </select>
      </div>
    </div>
    
    <div class="form-group" style="display: flex; align-items: center; gap: 8px; margin-top: 16px;">
      <input type="checkbox" id="m-item-active" checked style="width: auto;">
      <label for="m-item-active" style="margin-bottom: 0; cursor: pointer;">Active (Available for billing)</label>
    </div>
    
    <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; border-top: 1px solid var(--color-border); padding-top: 16px;">
      <button id="btn-modal-cancel" class="btn">Cancel</button>
      <button id="btn-modal-save" class="btn btn-primary">Save Item</button>
    </div>
  </div>
</div>
