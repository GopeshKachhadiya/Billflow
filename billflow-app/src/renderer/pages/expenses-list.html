<div class="expenses-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
  <div>
    <h1 style="font-family: var(--font-serif); font-size: 24px; color: var(--color-primary);">Business Expenses & GST Input Tax Credit</h1>
    <p style="color: var(--color-text-muted); font-size: 13px;">Track company expenditure, vendor bills, and claimable GST input credits.</p>
  </div>
  <button id="btn-add-expense" class="btn btn-primary">+ Record Expense</button>
</div>

<!-- Summary Cards -->
<div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px;">
  <div class="card" style="padding: 18px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 8px; box-shadow: var(--shadow-paper);">
    <span style="font-size: 12px; font-weight: 600; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.5px;">Total Expenditure</span>
    <div id="exp-summary-total" style="font-family: var(--font-serif); font-size: 26px; font-weight: 700; color: var(--color-primary); margin-top: 6px;">₹0.00</div>
  </div>
  <div class="card" style="padding: 18px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 8px; box-shadow: var(--shadow-paper);">
    <span style="font-size: 12px; font-weight: 600; color: var(--color-success); text-transform: uppercase; letter-spacing: 0.5px;">Claimable GST (ITC)</span>
    <div id="exp-summary-gst" style="font-family: var(--font-serif); font-size: 26px; font-weight: 700; color: var(--color-success); margin-top: 6px;">₹0.00</div>
  </div>
  <div class="card" style="padding: 18px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 8px; box-shadow: var(--shadow-paper);">
    <span style="font-size: 12px; font-weight: 600; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.5px;">Top Category</span>
    <div id="exp-summary-cat" style="font-family: var(--font-serif); font-size: 22px; font-weight: 700; color: var(--color-primary); margin-top: 6px;">—</div>
  </div>
</div>

<!-- Filter and Search -->
<div class="card" style="padding: 16px; margin-bottom: 20px;">
  <div style="display: flex; gap: 16px; align-items: center;">
    <div style="flex: 1;">
      <input type="text" id="expense-search" placeholder="Search by vendor name or notes..." style="width: 100%; padding: 10px 14px; border: 1px solid var(--color-border); border-radius: 6px; font-size: 13px;">
    </div>
    <div style="width: 200px;">
      <select id="expense-filter-category" style="width: 100%; padding: 10px 14px; border: 1px solid var(--color-border); border-radius: 6px; font-size: 13px;">
        <option value="all">All Categories</option>
        <option value="Office Supplies">Office Supplies</option>
        <option value="Travel & Meals">Travel & Meals</option>
        <option value="Software & SaaS">Software & SaaS</option>
        <option value="Rent & Utilities">Rent & Utilities</option>
        <option value="Marketing & Ads">Marketing & Ads</option>
        <option value="Legal & Professional">Legal & Professional</option>
        <option value="General">General</option>
      </select>
    </div>
  </div>
</div>

<!-- Expenses Table -->
<div class="card" style="padding: 0; overflow: hidden;">
  <div class="table-responsive">
    <table style="margin-bottom: 0; width: 100%; border-collapse: collapse;">
      <thead>
        <tr style="background-color: var(--color-surface-elevated); border-bottom: 1px solid var(--color-border);">
          <th style="padding: 12px 16px; text-align: left; font-size: 12px; color: var(--color-text-muted);">Date</th>
          <th style="padding: 12px 16px; text-align: left; font-size: 12px; color: var(--color-text-muted);">Category</th>
          <th style="padding: 12px 16px; text-align: left; font-size: 12px; color: var(--color-text-muted);">Vendor</th>
          <th style="padding: 12px 16px; text-align: right; font-size: 12px; color: var(--color-text-muted);">Amount</th>
          <th style="padding: 12px 16px; text-align: right; font-size: 12px; color: var(--color-text-muted);">GST (ITC)</th>
          <th style="padding: 12px 16px; text-align: left; font-size: 12px; color: var(--color-text-muted);">Notes</th>
          <th style="padding: 12px 16px; text-align: right; width: 130px; font-size: 12px; color: var(--color-text-muted);">Actions</th>
        </tr>
      </thead>
      <tbody id="expenses-tbody">
        <!-- Rendered dynamically -->
      </tbody>
    </table>
  </div>
</div>

<!-- Modal for Create/Edit Expense -->
<div id="expense-modal" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
  <div class="modal-box" style="width: 500px; background: var(--color-surface); padding: 24px; border-radius: 8px; border: 1px solid var(--color-border); box-shadow: var(--shadow-paper-md); text-align: left;">
    <h2 id="exp-modal-title" style="margin-bottom: 20px; font-family: var(--font-serif); font-size: 18px; font-weight: 700; border-bottom: 1px solid var(--color-border); padding-bottom: 10px; color: var(--color-primary);">Record New Expense</h2>
    
    <input type="hidden" id="m-exp-id">
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px;">
      <div class="form-group">
        <label style="display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px;">Bill Date *</label>
        <input type="date" id="m-exp-date" style="width: 100%; padding: 8px 12px; border: 1px solid var(--color-border); border-radius: 4px;">
      </div>
      <div class="form-group">
        <label style="display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px;">Category *</label>
        <select id="m-exp-category" style="width: 100%; padding: 8px 12px; border: 1px solid var(--color-border); border-radius: 4px;">
          <option value="Office Supplies">Office Supplies</option>
          <option value="Travel & Meals">Travel & Meals</option>
          <option value="Software & SaaS">Software & SaaS</option>
          <option value="Rent & Utilities">Rent & Utilities</option>
          <option value="Marketing & Ads">Marketing & Ads</option>
          <option value="Legal & Professional">Legal & Professional</option>
          <option value="General" selected>General</option>
        </select>
      </div>
    </div>
    
    <div class="form-group" style="margin-bottom: 14px;">
      <label style="display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px;">Vendor / Payee Name *</label>
      <input type="text" id="m-exp-vendor" placeholder="e.g. Amazon India or Landlord Name" style="width: 100%; padding: 8px 12px; border: 1px solid var(--color-border); border-radius: 4px;">
    </div>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px;">
      <div class="form-group">
        <label style="display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px;">Total Amount (₹) *</label>
        <input type="number" id="m-exp-amount" step="any" placeholder="0.00" style="width: 100%; padding: 8px 12px; border: 1px solid var(--color-border); border-radius: 4px;">
      </div>
      <div class="form-group">
        <label style="display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px;">GST Included (₹)</label>
        <input type="number" id="m-exp-gst" step="any" placeholder="0.00" style="width: 100%; padding: 8px 12px; border: 1px solid var(--color-border); border-radius: 4px;">
      </div>
    </div>
    
    <div class="form-group" style="margin-bottom: 20px;">
      <label style="display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px;">Notes / Purpose</label>
      <textarea id="m-exp-notes" rows="2" placeholder="e.g. Monthly cloud server subscription" style="width: 100%; padding: 8px 12px; border: 1px solid var(--color-border); border-radius: 4px;"></textarea>
    </div>
    
    <div style="display: flex; justify-content: flex-end; gap: 12px; border-top: 1px solid var(--color-border); padding-top: 16px;">
      <button id="btn-exp-cancel" class="btn" style="padding: 8px 16px; border: 1px solid var(--color-border); background: #fff; border-radius: 4px; cursor: pointer;">Cancel</button>
      <button id="btn-exp-save" class="btn btn-primary" style="padding: 8px 16px; background: var(--color-primary); color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: 600;">Save Expense</button>
    </div>
  </div>
</div>
