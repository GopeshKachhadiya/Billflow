<div class="customers-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
  <h1 data-i18n="customers_title">Customers</h1>
  <button id="btn-add-customer" class="btn btn-primary" data-i18n="new_customer">+ Add Customer</button>
</div>

<!-- Filter and Search -->
<div class="card" style="padding: 16px; margin-bottom: 20px;">
  <div style="display: flex; gap: 16px; align-items: center;">
    <div style="flex: 1;">
      <input type="text" id="customer-search" placeholder="Search by name, email, or phone..." data-i18n-placeholder="search_customers_ph" style="width: 100%;">
    </div>
    <div style="width: 150px;">
      <select id="customer-filter-active">
        <option value="all" data-i18n="nav_customers">All Customers</option>
        <option value="active" selected>Active Only</option>
        <option value="inactive">Inactive Only</option>
      </select>
    </div>
  </div>
</div>

<!-- Customers Table -->
<div class="card" style="padding: 0; overflow: hidden;">
  <div class="table-responsive">
    <table style="margin-bottom: 0;">
      <thead>
        <tr>
          <th data-i18n="customer_name">Name</th>
          <th data-i18n="email">Email</th>
          <th data-i18n="phone">Phone</th>
          <th data-i18n="state">State</th>
          <th style="text-align: center;" data-i18n="status">Status</th>
          <th style="text-align: right; width: 220px;" data-i18n="btn_actions">Actions</th>
        </tr>
      </thead>
      <tbody id="customers-tbody">
        <!-- Rendered dynamically -->
      </tbody>
    </table>
  </div>
</div>
