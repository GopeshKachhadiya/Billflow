<div class="settings-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
  <h1>Settings</h1>
  <button id="btn-save-settings" class="btn btn-primary">Save Settings</button>
</div>

<div class="card" style="padding: 0; overflow: hidden; display: flex; flex-direction: column;">
  <!-- Tab navigation -->
  <div class="tab-nav" style="display: flex; border-bottom: 1px solid var(--color-border); background: #F9FAFB;">
    <button class="tab-link active" onclick="switchSettingsTab(event, 'tab-business')" style="padding: 14px 20px; font-weight: 600; border: none; background: none; border-bottom: 2px solid var(--color-primary); color: var(--color-primary); cursor: pointer;">Business Profile</button>
    <button class="tab-link" onclick="switchSettingsTab(event, 'tab-template')" style="padding: 14px 20px; font-weight: 500; border: none; background: none; color: var(--color-text-muted); cursor: pointer;">Bill Template</button>
    <button class="tab-link" onclick="switchSettingsTab(event, 'tab-integrations')" style="padding: 14px 20px; font-weight: 500; border: none; background: none; color: var(--color-text-muted); cursor: pointer;">Integrations</button>
  </div>

  <!-- Tab Content -->
  <div class="tab-content-container" style="padding: 24px;">
    
    <!-- Tab 1: Business Profile -->
    <div id="tab-business" class="settings-tab-pane" style="display: block;">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div class="form-group">
          <label>Business Name *</label>
          <input type="text" id="s-business_name" placeholder="e.g. Acme Corporation">
        </div>
        <div class="form-group">
          <label>GSTIN</label>
          <input type="text" id="s-gstin" placeholder="e.g. 27AAAAA0000A1Z5">
        </div>
        <div class="form-group" style="grid-column: span 2;">
          <label>Address</label>
          <textarea id="s-business_address" rows="2" placeholder="e.g. 123 Main St"></textarea>
        </div>
        <div class="form-group">
          <label>City</label>
          <input type="text" id="s-business_city" placeholder="e.g. Mumbai">
        </div>
        <div class="form-group">
          <label>State</label>
          <select id="s-business_state">
            <option value="">Select State</option>
            <option value="Maharashtra">Maharashtra</option>
            <option value="Delhi">Delhi</option>
            <option value="Karnataka">Karnataka</option>
            <option value="Tamil Nadu">Tamil Nadu</option>
            <option value="Gujarat">Gujarat</option>
            <option value="Uttar Pradesh">Uttar Pradesh</option>
            <option value="West Bengal">West Bengal</option>
            <option value="Telangana">Telangana</option>
            <!-- Add other states as fallback -->
          </select>
        </div>
        <div class="form-group">
          <label>PIN Code</label>
          <input type="text" id="s-business_pin" placeholder="e.g. 400001">
        </div>
        <div class="form-group">
          <label>PAN</label>
          <input type="text" id="s-pan" placeholder="e.g. ABCDE1234F">
        </div>
      </div>

      <h3 style="margin: 24px 0 16px 0; border-bottom: 1px solid var(--color-border); padding-bottom: 8px; font-size: 15px;">Bank Details</h3>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div class="form-group">
          <label>Bank Name</label>
          <input type="text" id="s-bank_name" placeholder="e.g. HDFC Bank">
        </div>
        <div class="form-group">
          <label>Account Number</label>
          <input type="text" id="s-bank_account" placeholder="e.g. 50100012345678">
        </div>
        <div class="form-group">
          <label>IFSC Code</label>
          <input type="text" id="s-bank_ifsc" placeholder="e.g. HDFC0000001">
        </div>
      </div>
    </div>

    <!-- Tab 2: Bill Template -->
    <div id="tab-template" class="settings-tab-pane" style="display: none;">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div class="form-group">
          <label>Bill Prefix</label>
          <input type="text" id="s-bill_prefix" placeholder="e.g. INV-2026-">
        </div>
        <div class="form-group">
          <label>Default GST Rate (%)</label>
          <select id="s-default_gst_rate">
            <option value="0">0%</option>
            <option value="5">5%</option>
            <option value="12">12%</option>
            <option value="18" selected>18%</option>
            <option value="28">28%</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Tab 3: Integrations -->
    <div id="tab-integrations" class="settings-tab-pane" style="display: none;">
      <h3 style="margin-bottom: 16px; font-size: 15px;">Email SMTP Settings</h3>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px;">
        <div class="form-group">
          <label>From Name</label>
          <input type="text" id="s-email_from_name" placeholder="e.g. Billing Dept">
        </div>
        <div class="form-group">
          <label>From Email Address</label>
          <input type="email" id="s-email_from_address" placeholder="e.g. billing@acme.com">
        </div>
        <div class="form-group">
          <label>SMTP Host</label>
          <input type="text" id="s-smtp_host" placeholder="smtp.gmail.com">
        </div>
        <div class="form-group">
          <label>SMTP Port</label>
          <input type="text" id="s-smtp_port" placeholder="587">
        </div>
        <div class="form-group">
          <label>SMTP User</label>
          <input type="text" id="s-smtp_user" placeholder="user@gmail.com">
        </div>
        <div class="form-group">
          <label>SMTP Password</label>
          <input type="password" id="s-smtp_pass" placeholder="••••••••••••••••">
        </div>
        <div class="form-group">
          <label>Accountant CC Email</label>
          <input type="email" id="s-accountant_email" placeholder="accountant@acme.com">
        </div>
      </div>

      <h3 style="border-top: 1px solid var(--color-border); padding-top: 24px; margin-bottom: 16px; font-size: 15px;">WhatsApp (WATI) Settings</h3>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px;">
        <div class="form-group" style="grid-column: span 2; display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="s-wati-enabled" style="width: auto;">
          <label for="s-wati-enabled" style="margin-bottom: 0; cursor: pointer;">Enable WhatsApp Integration</label>
        </div>
        <div class="form-group">
          <label>WATI API URL</label>
          <input type="text" id="s-wati_api_url" placeholder="https://live-server.wati.io/api/v1">
        </div>
        <div class="form-group">
          <label>WATI Access Token</label>
          <input type="password" id="s-wati_api_token" placeholder="••••••••••••••••">
        </div>
      </div>

      <h3 style="border-top: 1px solid var(--color-border); padding-top: 24px; margin-bottom: 16px; font-size: 15px;">SMS (MSG91) Settings</h3>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px;">
        <div class="form-group" style="grid-column: span 2; display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="s-sms-enabled" style="width: auto;">
          <label for="s-sms-enabled" style="margin-bottom: 0; cursor: pointer;">Enable SMS Integration</label>
        </div>
        <div class="form-group">
          <label>MSG91 AUTH Key</label>
          <input type="password" id="s-msg91_auth_key" placeholder="••••••••••••••••">
        </div>
        <div class="form-group">
          <label>MSG91 Sender ID</label>
          <input type="text" id="s-msg91_sender_id" placeholder="e.g. ACMESM">
        </div>
      </div>

      <h3 style="border-top: 1px solid var(--color-border); padding-top: 24px; margin-bottom: 16px; font-size: 15px;">n8n Webhook Integration</h3>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px;">
        <div class="form-group">
          <label>n8n Base URL</label>
          <input type="text" id="s-n8n_base_url" placeholder="e.g. http://localhost:5678">
        </div>
        <div class="form-group">
          <label>n8n Secret Auth Key</label>
          <input type="text" id="s-n8n_secret" placeholder="Secret matching n8n headers">
        </div>
      </div>

      <h3 style="border-top: 1px solid var(--color-border); padding-top: 24px; margin-bottom: 16px; font-size: 15px;">Owner Notifications</h3>
      <div style="display: grid; grid-template-columns: 1fr; gap: 12px;">
        <div class="form-group">
          <label>Owner Phone Number (for WhatsApp/SMS)</label>
          <input type="text" id="s-notify_owner_phone" placeholder="e.g. +919876543210" style="width: 300px;">
        </div>
        <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="s-notify-whatsapp" style="width: auto;">
          <label for="s-notify-whatsapp" style="margin-bottom: 0; cursor: pointer;">Receive alerts on WhatsApp</label>
        </div>
        <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="s-notify-daily-summary" style="width: auto;">
          <label for="s-notify-daily-summary" style="margin-bottom: 0; cursor: pointer;">Receive Daily Sales Summary</label>
        </div>
        <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="s-notify-weekly-report" style="width: auto;">
          <label for="s-notify-weekly-report" style="margin-bottom: 0; cursor: pointer;">Receive Weekly Summary Report</label>
        </div>
        <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="s-notify-monthly-gst" style="width: auto;">
          <label for="s-notify-monthly-gst" style="margin-bottom: 0; cursor: pointer;">Receive Monthly GST Aggregate Summary</label>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
function switchSettingsTab(evt, tabId) {
  var tabPanes = document.getElementsByClassName("settings-tab-pane");
  for (var i = 0; i < tabPanes.length; i++) {
    tabPanes[i].style.display = "none";
  }
  var tabLinks = document.getElementsByClassName("tab-link");
  for (var i = 0; i < tabLinks.length; i++) {
    tabLinks[i].classList.remove("active");
    tabLinks[i].style.color = "var(--color-text-muted)";
    tabLinks[i].style.borderBottom = "none";
    tabLinks[i].style.fontWeight = "500";
  }
  document.getElementById(tabId).style.display = "block";
  evt.currentTarget.classList.add("active");
  evt.currentTarget.style.color = "var(--color-primary)";
  evt.currentTarget.style.borderBottom = "2px solid var(--color-primary)";
  evt.currentTarget.style.fontWeight = "600";
}

// Load states database settings list mapping if state codes exists
if (window.StateCodes) {
  var selectState = document.getElementById('s-business_state');
  if (selectState) {
    selectState.innerHTML = '<option value="">Select State</option>';
    window.StateCodes.forEach(function(st) {
      var opt = document.createElement('option');
      opt.value = st.name;
      opt.textContent = st.name + ' (' + st.code + ')';
      selectState.appendChild(opt);
    });
  }
}
</script>
