version: '3.8'

services:
  n8n:
    image: n8nio/n8n:1.24.1
    container_name: billflow-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

  billadmin:
    build:
      context: ./billadmin
      dockerfile: Dockerfile
    container_name: billflow-admin
    ports:
      - "5173:5173"
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-https://placeholder.supabase.co}
      - VITE_SUPABASE_SERVICE_KEY=${VITE_SUPABASE_SERVICE_KEY:-placeholder}
      - VITE_N8N_BASE_URL=${VITE_N8N_BASE_URL:-http://localhost:5678}
      - VITE_N8N_SECRET=${VITE_N8N_SECRET:-placeholder}
    restart: unless-stopped

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: billflow-consumer
    ports:
      - "8080:8080" # noVNC web access
      - "5900:5900" # raw VNC port
    environment:
      - RESOLUTION=1280x800
    volumes:
      - consumer_config:/root/.config
    restart: unless-stopped

volumes:
  n8n_data:
  consumer_config:
